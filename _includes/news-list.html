<ul class="news-list">
  {% for item in site.data.news %}{% unless item.archived %}
  <li class="news-list__item">
    <span class="news-list__date">{{ item.date }}</span>
    <span class="news-list__text">{{ item.text }}</span>
    {% if item.link %} <a class="news-list__link" href="{{ item.link.url }}">{{ item.link.text }}</a>{% endif %}
  </li>
  {% endunless %}{% endfor %}
</ul>
